xt x="238" y="307" class="m mu" font-size="12">Clinical trial platforms. Architected load frameworks, bottleneck analysis at enterprise scale.</text></g><g class="in" style="animation-duration:0.90s"><text x="34" y="336" class="m mu" font-size="10.5" letter-spacing="1.4">SEPT 2017 — FEB 2020</text><circle cx="214" cy="332" r="4.5" class="node"/><text x="238" y="337" class="b role tx">SS&amp;C EZE Software</text><text x="238" y="357" class="m ac" font-size="10.5" letter-spacing="1.4">SR. PERFORMANCE ENGINEER</text><text x="238" y="375" class="m mu" font-size="12">Financial trading systems. Performance profiling, capacity planning, and automated benchmarking.</text></g><g class="in" style="animation-duration:1.00s"><text x="34" y="404" class="m mu" font-size="10.5" letter-spacing="1.4">OCT 2014 — SEPT 2017</text><circle cx="214" cy="400" r="4.5" class="node"/><text x="238" y="405" class="b role tx">NCR Corporation</text><text x="238" y="425" class="m ac" font-size="10.5" letter-spacing="1.4">SR. PERFORMANCE ENGINEER</text><text x="238" y="443" class="m mu" font-size="12">Retail &amp; banking platforms. JMeter harnesses, distributed load generation, real-time telemetry.</text></g><g class="in" style="animation-duration:1.10s"><text x="34" y="472" class="m mu" font-size="10.5" letter-spacing="1.4">APR 2010 — OCT 2014</text><circle cx="214" cy="468" r="4.5" class="node"/><text x="238" y="473" class="b role tx">Infibeam Avenues</text><text x="238" y="493" class="m ac" font-size="10.5" letter-spacing="1.4">SR. SOFTWARE ENGINEER</text><text x="238" y="511" class="m mu" font-size="12">E-commerce platform engineering, full-stack automation, and continuous integration pipelines.</text></g><g class="in" style="animation-duration:1.20s"><text x="34" y="540" class="m mu" font-size="10.5" letter-spacing="1.4">SEPT 2009 — JAN 2010</text><circle cx="214" cy="536" r="4.5" class="node"/><text x="238" y="541" class="b role tx">Zensar Technologies</text><text x="238" y="561" class="m ac