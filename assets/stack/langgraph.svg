<svg xmlns="http://www.w3.org/2000/svg" width="80" height="64" viewBox="0 0 80 64" role="img" aria-label="LangGraph"><style>svg{--tx:#1d1d1f;--mu:#6e6e73;--ac:#0071e3;--bd:#d2d2d7;--sf:#f5f5f7;--grid:#e5e5ea;--on:#ffffff}@media(prefers-color-scheme:dark){svg{--tx:#f5f5f7;--mu:#98989d;--ac:#2997ff;--bd:#38383a;--sf:#1c1c1e;--grid:#2c2c2e;--on:#ffffff}}
.d{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif} .b{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.tx{fill:var(--tx)} .mu{fill:var(--mu)} .ac{fill:var(--ac)}
.kick{font-size:10.5px;letter-spacing:2.4px;font-weight:500}
.lab{font-size:9px;letter-spacing:1.6px}
.card{fill:var(--sf);stroke:var(--bd);stroke-width:1}
.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x="0.5" y="0.5" width="79" height="63" rx="6" class="card"/>
