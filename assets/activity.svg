<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="daily contribution activity"><style>svg{--tx:#1d1d1f;--mu:#6e6e73;--ac:#0071e3;--bd:#d2d2d7;--sf:#f5f5f7;--grid:#e5e5ea;--on:#ffffff}@media(prefers-color-scheme:dark){svg{--tx:#f5f5f7;--mu:#98989d;--ac:#2997ff;--bd:#38383a;--sf:#1c1c1e;--grid:#2c2c2e;--on:#ffffff}}
.d{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif} .b{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.tx{fill:var(--tx)} .mu{fill:var(--mu)} .ac{fill:var(--ac)}
.kick{font-size:10.5px;letter-spacing:2.4px;font-weight:500}
.lab{font-size:9px;letter-spacing:1.6px}
.card{fill:var(--sf);stroke:var(--bd);stroke-width:1}
.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

    .grid{stroke:var(--grid);stroke-width:1}
    .spark{fill:none;stroke:var(--ac);stroke-width:1.6;stroke-linejoin:round;
      stroke-dasharray:4200;animation:trace 2.4s cubic-bezier(.3,.6,.2,1) forwards}
    .fill{fill:var(--ac);opacity:.12;animation:fade 1.8s forwards}
    @keyframes trace{from{stroke-dashoffset:4200}to{stroke-dashoffset:0}}
    @keyframes fade{from{opacity:0}to{opacity:.12}}
