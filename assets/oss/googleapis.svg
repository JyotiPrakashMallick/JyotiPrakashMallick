<svg xmlns="http://www.w3.org/2000/svg" width="196" height="58" viewBox="0 0 196 58" role="img" aria-label="Google BigQuery — data warehouse"><style>svg{--tx:#1d1d1f;--mu:#6e6e73;--ac:#0071e3;--bd:#d2d2d7;--sf:#f5f5f7;--grid:#e5e5ea;--on:#ffffff}@media(prefers-color-scheme:dark){svg{--tx:#f5f5f7;--mu:#98989d;--ac:#2997ff;--bd:#38383a;--sf:#1c1c1e;--grid:#2c2c2e;--on:#ffffff}}
.d{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif} .b{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.tx{fill:var(--tx)} .mu{fill:var(--mu)} .ac{fill:var(--ac)}
.kick{font-size:10.5px;letter-spacing:2.4px;font-weight:500}
.lab{font-size:9px;letter-spacing:1.6px}
.card{fill:var(--sf);stroke:var(--bd);stroke-width:1}
.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x="0.5" y="0.5" width="195" height="57" rx="5" class="card"/>
<clipPath id="c"><rect x="14" y="15" width="28" height="28" rx="6"/></clipPath>
<rect x="14" y="15" width="28" height="28" rx="6" fill="#ffffff"/>
<image href="data:image/png;base64," x="14" y="15" width="28" height="28" clip-path="url(#c)" preserveAspectRatio="xMidYMid slice"/>
<text x="54" y="29" class="b tx" font-size="12.5">Google BigQuery</text>
<text x="54" y="42" class="m lab mu">DATA WAREHOUSE</text></svg>