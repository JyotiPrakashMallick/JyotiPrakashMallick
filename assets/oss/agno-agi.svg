<svg xmlns="http://www.w3.org/2000/svg" width="196" height="58" viewBox="0 0 196 58" role="img" aria-label="Agno — agent framework"><style>svg{--tx:#1a1a1a;--mu:#666660;--ac:#b84700;--bd:#dddddd;--sf:#faf9f2;--grid:#e8e8e0;--on:#ffffff}@media(prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#8b949e;--ac:#b84700;--bd:#30363d;--sf:#161b22;--grid:#21262d;--on:#ffffff}}
.d{font-family:'Unica One', Impact, 'Haettenschweiler', 'Arial Narrow', sans-serif} .b{font-family:'Supreme', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.tx{fill:var(--tx)} .mu{fill:var(--mu)} .ac{fill:var(--ac)}
.kick{font-size:10.5px;letter-spacing:2.4px;font-weight:500}
.lab{font-size:9px;letter-spacing:1.6px}
.card{fill:var(--sf);stroke:var(--bd);stroke-width:1}
.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x="0.5" y="0.5" width="195" height="57" rx="5" class="card"/>
<clipPath id="c"><rect x="14" y="15" width="28" height="28" rx="6"/></clipPath>
<rect x="14" y="15" width="28" height="28" rx="6" fill="#ffffff"/>
<image href="data:image/png;base64," x="14" y="15" width="28" height="28" clip-path="url(#c)" preserveAspectRatio="xMidYMid slice"/>
<text x="54" y="29" class="b tx" font-size="12.5">Agno</text>
<text x="54" y="42" class="m lab mu">AGENT FRAMEWORK</text></svg>