<svg xmlns="http://www.w3.org/2000/svg" width="900" height="34" viewBox="0 0 900 34" role="img" aria-label="live status"><style>svg{--tx:#1d1d1f;--mu:#6e6e73;--ac:#0071e3;--bd:#d2d2d7;--sf:#f5f5f7;--grid:#e5e5ea;--on:#ffffff}@media(prefers-color-scheme:dark){svg{--tx:#f5f5f7;--mu:#98989d;--ac:#2997ff;--bd:#38383a;--sf:#1c1c1e;--grid:#2c2c2e;--on:#ffffff}}
.d{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif} .b{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.tx{fill:var(--tx)} .mu{fill:var(--mu)} .ac{fill:var(--ac)}
.kick{font-size:10.5px;letter-spacing:2.4px;font-weight:500}
.lab{font-size:9px;letter-spacing:1.6px}
.card{fill:var(--sf);stroke:var(--bd);stroke-width:1}
.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

    .bar{fill:var(--sf)} .edge{stroke:var(--bd);stroke-width:1}
    .dot{fill:var(--ac);animation:pulse 2s ease-in-out infinite}
    .halo{fill:var(--ac);opacity:.3;animation:halo 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    @keyframes halo{0%{opacity:.3;r:4}70%,100%{opacity:0;r:11}}
    </style><rect x="0" y="0" width="900" height="34" class="bar"/>
<line x1="0" y1="0.5" x2="900" y2="0.5" class="edge"/><line x1="0" y1="33.5" x2="900" y2="33.5" class="edge"/>
<circle cx="20" cy="17" r="4" class="halo"/><circle cx="20" cy="17" r="3" class="dot"/>
<text x="38" y="22" class="m lab mu">LAST SHIPPED</text><text x="136" y="22" class="m tx" font-size="11">—</text>
<text x="380" y="22" class="m lab mu">NOW</text><text x="415" y="22" class="m tx" font-size="11">Auditoria.AI · AI Performance Engineer</text>
<text x="880" y="22" text-anchor="end" class="m lab mu">REFRESHED 20 OCT 2026</text></svg>