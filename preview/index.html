reliability, high throughput, and fault tolerance are non-negotiable. That shift requires
engineers who obsess over performance engineering, distributed orchestration, bottlenecks,
and observability as much as model capability. That's the work I do.</p>

<ul><li><b>Sub-100ms P99 latency SLAs</b> across distributed AI microservices handling millions of daily records and real-time transaction streams.</li>
<li><b>Automated enterprise load testing harnesses</b> with custom JMeter telemetry listeners streaming real-time metrics to Azure Cosmos DB & SQL Server.</li>
<li><b>Elastic containerized architectures on AWS ECS & Azure</b> with automated Keptn SLI performance validation gates built into CI/CD pipelines.</li>
</ul>
